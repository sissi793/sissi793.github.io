<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet"> <!-- Modern font -->
    <style>
        body {
            font-family: 'Poppins', sans-serif; /* Applying the modern font */
        }

        img {
            width: 100%;
            display: block;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 5rem;
            text-align: center;
            margin: 0;
        }

        .button-container {
            text-align: center;
            margin-top: 30px;
        }

        .btn {
            background-color: #ec9ebb; /* New background color */
            color: black;
            border: none;
            padding: 20px; /* Adjust padding for a more balanced circle */
            font-size: 2rem; /* Adjust font size to fit well */
            cursor: pointer;
            border-radius: 50%; /* Making buttons round */
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease, transform 0.2s ease; /* Smooth transition */
            width: 80px; /* Fixed width */
            height: 80px; /* Fixed height */
        }

        .btn:hover {
            background-color: #c68794; /* Slightly darker background on hover */
            transform: scale(1.1); /* Slight scale effect on hover */
        }

        .btn i {
            margin: 0; /* Remove any default margin */
        }

        .btn.instagram {
            background-color: #ec9ebb; /* Instagram specific color */
        }

        .btn.email {
            background-color: #ec9ebb; /* Email specific color */
        }
    </style>
</head>
<body>
    <embed src="portfolio.pdf" width="100%" height="600px" type="application/pdf">
</body>
</html>
